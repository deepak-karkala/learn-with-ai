[tool:pytest]
# MVP Demo configuration - skip tests with external dependencies
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
filterwarnings = 
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
addopts = 
    -v
    --tb=short
    --disable-warnings
    -m "not external_deps"
    --ignore=tests/test_session_persistence.py
    --ignore=tests/test_session_persistence_simple.py
    --ignore=tests/test_adk_session_integration.py
    --ignore=tests/test_adk_service.py
    --ignore=tests/test_assessment_e2e.py
    --ignore=tests/test_voice_api.py
    --ignore=tests/security/test_auth_middleware.py
    --ignore=tests/security/test_auth_service.py
    --ignore=tests/security/test_security_integration.py
    --ignore=tests/security/test_security_service.py
markers = 
    external_deps: mark test as requiring external dependencies (Redis, ADK artifacts, etc.)
    integration: mark test as integration test
    unit: mark test as unit test