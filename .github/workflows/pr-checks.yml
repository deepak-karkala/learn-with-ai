name: PR Checks

on:
  pull_request:
    branches: [ develop ]

jobs:
  tests-and-review:
    runs-on: ubuntu-latest
    name: Tests and Code Review
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Frontend Tests
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd frontend
        npm run lint
        npm test
        npm run build

    # Backend Tests
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync

    - name: Run backend tests
      run: |
        cd backend
        source .venv/bin/activate
        python -m flake8 .
        python -m black --check .
        python -m isort --check-only .
        python -m mypy app/
        python -m pytest --cov=app

    # Claude Code Review
    - name: Install Claude CLI
      run: |
        npm install -g @anthropic-ai/claude-code
        claude --version || echo "Claude CLI check failed"

    - name: Run Claude Code Review
      run: |
        echo "🤖 Running Claude Code Review..."
        cd backend
        ./review-claude.sh general > ../claude-review.txt 2>&1 || echo "Claude review completed"
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Post Claude Review Comment
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let review = 'Claude Code Review not available';
          
          try {
            if (fs.existsSync('claude-review.txt')) {
              review = fs.readFileSync('claude-review.txt', 'utf8');
            }
          } catch (e) {
            console.log('Could not read review file:', e.message);
          }
          
          const comment = `## 🤖 Claude Code Review Results

\`\`\`
${review.trim()}
\`\`\`

---
*✅ Tests passed and code reviewed. Ready for staging deployment.*`;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });