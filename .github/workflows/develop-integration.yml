name: Develop Branch Integration

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  # Always run CI and Claude Code Review
  ci-and-review:
    runs-on: ubuntu-latest
    name: CI and Code Review
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Frontend CI
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Frontend linting and tests
      run: |
        cd frontend
        npm run lint
        npm test
        npm run build

    # Backend CI  
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync

    - name: Backend linting and tests
      run: |
        cd backend
        source .venv/bin/activate
        python -m flake8 .
        python -m black --check .
        python -m isort --check-only .
        python -m mypy app/
        python -m pytest --cov=app

    # Claude Code Review (always runs)
    - name: Install Claude Code CLI
      run: |
        npm install -g @anthropic-ai/claude-code
        claude --version || echo "Claude CLI installation verification failed"

    - name: Run Claude Code Review
      run: |
        if command -v claude > /dev/null 2>&1; then
          echo "🤖 Running Claude Code Review..."
          cd backend && ./review-claude.sh general > ../claude-review-general.txt 2>&1 || echo "General review failed"
          cd backend && ./review-claude.sh security > ../claude-review-security.txt 2>&1 || echo "Security review failed"  
          cd backend && ./review-claude.sh adk > ../claude-review-adk.txt 2>&1 || echo "ADK review failed"
        else
          echo "⚠️ Claude CLI not available" > claude-review-general.txt
        fi
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Comment PR with Claude Review
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let generalReview = 'No general review available';
          let securityReview = 'No security review available'; 
          let adkReview = 'No ADK review available';
          
          try {
            if (fs.existsSync('claude-review-general.txt')) {
              generalReview = fs.readFileSync('claude-review-general.txt', 'utf8');
            }
            if (fs.existsSync('claude-review-security.txt')) {
              securityReview = fs.readFileSync('claude-review-security.txt', 'utf8');
            }
            if (fs.existsSync('claude-review-adk.txt')) {
              adkReview = fs.readFileSync('claude-review-adk.txt', 'utf8');
            }
          } catch (e) {
            console.log('Error reading review files:', e.message);
          }
          
          const comment = `## 🤖 Claude Code Review
          
This automated review was generated by Claude Code.

### 📋 General Code Review
\`\`\`
${generalReview.trim()}
\`\`\`

### 🔒 Security Review  
\`\`\`
${securityReview.trim()}
\`\`\`

### 🚀 ADK-Specific Review
\`\`\`
${adkReview.trim()}
\`\`\`

---
*✅ After addressing any feedback, mark this PR as "Ready for review" to trigger staging deployment.*
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Only deploy to staging when PR is ready for review (not draft)
  staging-deployment:
    needs: ci-and-review
    runs-on: ubuntu-latest
    name: Deploy to Staging
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Vercel Staging
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: ./

    - name: Comment with staging URL
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚀 **Staging deployment complete!** Please verify the changes manually before proceeding to production.'
          });