name: Production CI

on:
  push:
    branches: [ main ]  # Run when code is pushed to main
  pull_request:
    branches: [ main ]  # Run on PRs to main (from develop)

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build application
      run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Create virtual environment and install dependencies
      run: |
        uv sync

    - name: Run linting
      run: |
        source .venv/bin/activate
        python -m flake8 .
        python -m black --check .
        python -m isort --check-only .

    - name: Run type checking
      run: |
        source .venv/bin/activate
        python -m mypy app/

    - name: Run tests with coverage
      run: |
        source .venv/bin/activate
        python -m pytest --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: backend/coverage.xml
        directory: backend/
        fail_ci_if_error: false

  deployment-ready:
    needs: [test-frontend, test-backend]
    runs-on: ubuntu-latest
    steps:
    - name: Production deployment ready
      run: |
        echo "✅ All production CI checks passed"
        echo "🚀 Ready for production deployment"