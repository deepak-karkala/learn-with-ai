name: Preview Deploy to Vercel

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
        - preview
        - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy to Vercel Preview
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.5.11"
        
    - name: Install backend dependencies
      run: |
        cd backend
        uv sync --dev
        
    - name: Run backend tests
      run: |
        cd backend
        source .venv/bin/activate
        python -m pytest tests/ --maxfail=3 --tb=short
      env:
        # Mock environment variables for testing
        GOOGLE_API_KEY: "fake-key-for-testing"
        ADK_MODEL_NAME: "gemini-2.0-flash-exp"
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Deploy to Vercel Preview
      id: deploy
      run: |
        cd frontend
        # Deploy and capture the output with preview URL
        DEPLOY_OUTPUT=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
        echo "$DEPLOY_OUTPUT"
        
        # Extract preview URL from the output
        PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
        
        if [ -n "$PREVIEW_URL" ]; then
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "🚀 Preview URL found: $PREVIEW_URL"
        else
          echo "⚠️ Could not extract preview URL from deployment output"
          echo "preview_url=" >> $GITHUB_OUTPUT
        fi
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        
    - name: Create deployment comment
      uses: actions/github-script@v7
      with:
        script: |
          const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
          const commit = context.sha.substring(0, 7);
          const branch = context.ref.replace('refs/heads/', '');
          
          const comment = `## 🚀 Preview Deployment
          
          **Branch:** \`${branch}\`
          **Commit:** \`${commit}\`
          **Preview URL:** ${previewUrl || 'Deployment in progress...'}
          
          ### Features Available:
          - ✅ FastAPI backend with ADK integration
          - ✅ Health check endpoints
          - ✅ Chat functionality with Gemini 2.0 Flash
          - ✅ Real-time streaming responses
          - ✅ Connection pooling optimizations
          
          ### Testing:
          \`\`\`bash
          # Test health endpoint
          curl ${previewUrl || 'PREVIEW_URL'}/api/health
          
          # Test chat endpoint
          curl -X POST ${previewUrl || 'PREVIEW_URL'}/api/chat \\
            -H "Content-Type: application/json" \\
            -d '{"message": "Hello", "user_id": "test"}'
          \`\`\`
          
          ---
          *⚡ Automated deployment from develop branch*`;
          
          // Create a commit comment instead of issue comment for push events
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: comment
          });
          
    - name: Run post-deployment health check
      run: |
        sleep 30  # Wait for deployment to be ready
        PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"
        if [ -n "$PREVIEW_URL" ]; then
          echo "Testing deployment health..."
          curl -f "$PREVIEW_URL/api/health" || echo "⚠️ Health check failed"
          echo "✅ Deployment health check completed"
        fi