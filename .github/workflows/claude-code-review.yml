name: Claude Code Review

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code Review
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git diff

    - name: Install Claude CLI
      run: |
        curl -fsSL https://claude.ai/install.sh | sh
        echo "$HOME/.claude/bin" >> $GITHUB_PATH

    - name: Setup Node.js (for frontend review)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Setup Python (for backend review)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv (Python package manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync

    - name: Run Claude Code Review - General
      id: claude-general
      run: |
        ./review-claude.sh full > claude-review-general.txt 2>&1 || true
        echo "GENERAL_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-general.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - Security
      id: claude-security  
      run: |
        ./review-claude.sh security > claude-review-security.txt 2>&1 || true
        echo "SECURITY_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-security.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - ADK Specific
      id: claude-adk
      run: |
        ./review-claude.sh adk > claude-review-adk.txt 2>&1 || true
        echo "ADK_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-adk.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Comment PR with Claude Review
      uses: actions/github-script@v7
      with:
        script: |
          const generalReview = `${{ steps.claude-general.outputs.GENERAL_REVIEW }}`;
          const securityReview = `${{ steps.claude-security.outputs.SECURITY_REVIEW }}`;
          const adkReview = `${{ steps.claude-adk.outputs.ADK_REVIEW }}`;
          
          let comment = `## 🤖 Claude Code Review
          
          This automated review was generated by Claude Code to help identify potential issues in your pull request.
          
          ### 📋 General Code Review
          \`\`\`
          ${generalReview}
          \`\`\`
          
          ### 🔒 Security Review  
          \`\`\`
          ${securityReview}
          \`\`\`
          
          ### 🚀 ADK-Specific Review
          \`\`\`
          ${adkReview}
          \`\`\`
          
          ---
          *This review is automated and may contain false positives. Please use your judgment and review the suggestions carefully.*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload review artifacts
      uses: actions/upload-artifact@v4
      with:
        name: claude-code-review-results
        path: |
          claude-review-*.txt
        retention-days: 30