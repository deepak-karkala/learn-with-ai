name: Continuous Integration

on:
  push:
    branches: [ main ]  # Only run CI on direct pushes to main
  pull_request:
    branches: [ main ]  # Run CI on PRs to main (this is where we need validation)

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run tests
        run: npm test
      
      - name: Build application
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      
      - name: Create and sync virtual environment
        run: |
          uv venv
          uv sync --dev
      
      - name: Run linting
        run: |
          source .venv/bin/activate
          flake8 app/
          black --check app/
          isort --check-only app/
      
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest
      
      - name: Type checking
        run: |
          source .venv/bin/activate
          mypy app/

  # Staging deployment moved to separate workflow (staging-deploy.yml)
  # This keeps CI focused on testing and validation only