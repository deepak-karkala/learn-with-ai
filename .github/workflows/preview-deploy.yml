name: Preview Deploy to Vercel

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'preview'
        type: choice
        options:
        - preview
        - staging

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy to Vercel Preview
    permissions:
      contents: write
      issues: write
      deployments: write
      statuses: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.5.11"
        
    - name: Install backend dependencies
      run: |
        cd backend
        uv sync --dev
        
    - name: Run backend tests
      run: |
        cd backend
        source .venv/bin/activate
        python -m pytest tests/ --maxfail=3 --tb=short
      env:
        # Mock environment variables for testing
        GOOGLE_API_KEY: "fake-key-for-testing"
        ADK_MODEL_NAME: "gemini-2.0-flash-exp"
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Deploy to Vercel Preview
      id: deploy
      run: |
        cd frontend
        # Deploy and capture the output with preview URL
        DEPLOY_OUTPUT=$(vercel --token=${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
        echo "$DEPLOY_OUTPUT"
        
        # Extract preview URL from the output
        PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^[:space:]]*\.vercel\.app' | head -1)
        
        if [ -n "$PREVIEW_URL" ]; then
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "🚀 Preview URL found: $PREVIEW_URL"
        else
          echo "⚠️ Could not extract preview URL from deployment output"
          echo "preview_url=" >> $GITHUB_OUTPUT
        fi
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
        
    - name: Create GitHub deployment
      uses: actions/github-script@v7
      with:
        script: |
          const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
          const commit = context.sha.substring(0, 7);
          const branch = context.ref.replace('refs/heads/', '');
          
          // Create deployment
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: 'preview',
            description: `Automated preview deployment from ${branch} branch`,
            auto_merge: false,
            required_contexts: []
          });
          
          // Create deployment status
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: deployment.data.id,
            state: previewUrl ? 'success' : 'failure',
            environment_url: previewUrl,
            description: previewUrl ? `Preview deployed to ${previewUrl}` : 'Deployment failed',
            log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          });
          
          console.log(`🚀 Preview deployment: ${previewUrl || 'Failed'}`);
          console.log(`📝 Deployment created for commit ${commit} on ${branch}`);
          
          // Close previous deployment issues to keep things clean
          try {
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'deployment,preview,automated',
              state: 'open'
            });
            
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
          } catch (error) {
            console.log('Could not close previous deployment issues:', error.message);
          }
          
          // Create new deployment issue (optional)
          if (previewUrl) {
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚀 Preview Deployment - ${new Date().toLocaleDateString()}`,
                body: `## Preview Deployment Successful
                
                **Branch:** \`${branch}\`
                **Commit:** \`${commit}\`
                **Preview URL:** ${previewUrl}
                **Build:** [View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
                
                ### 🧪 Test the deployment:
                \`\`\`bash
                # Health check
                curl ${previewUrl}/api/health
                
                # Chat API test
                curl -X POST ${previewUrl}/api/chat \\
                  -H "Content-Type: application/json" \\
                  -d '{"message": "Hello", "user_id": "test"}'
                \`\`\`
                
                ### ✅ Features deployed:
                - FastAPI backend with ADK integration
                - Health check endpoints  
                - Chat functionality with Gemini 2.0 Flash
                - Real-time streaming responses
                - Connection pooling optimizations
                
                *This issue will be automatically closed when a new deployment is created.*`,
                labels: ['deployment', 'preview', 'automated']
              });
            } catch (error) {
              console.log('Could not create deployment issue:', error.message);
            }
          }
          
    - name: Run post-deployment health check
      run: |
        sleep 30  # Wait for deployment to be ready
        PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"
        if [ -n "$PREVIEW_URL" ]; then
          echo "Testing deployment health..."
          curl -f "$PREVIEW_URL/api/health" || echo "⚠️ Health check failed"
          echo "✅ Deployment health check completed"
        fi