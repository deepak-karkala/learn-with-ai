name: Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-html pytest-xvfb
    
    - name: Run MVP test suite (fast)
      run: |
        cd backend
        python test_mvp.py
    
    - name: Run full backend tests with coverage
      run: |
        cd backend
        pytest tests/ -v \
          --cov=app \
          --cov-report=html \
          --cov-report=xml \
          --cov-report=term \
          --html=htmlcov/pytest_report.html \
          --self-contained-html \
          --maxfail=5
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: |
          backend/htmlcov/
          backend/pytest_report.html

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint
    
    - name: Run frontend unit tests with coverage
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false --passWithNoTests
    
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd frontend
        npx playwright install --with-deps
    
    - name: Set up Python for backend
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Start backend server in background
      run: |
        cd backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10  # Give server time to start
    
    - name: Start frontend server in background
      run: |
        cd frontend
        npm start &
        sleep 15  # Give server time to start
    
    - name: Run E2E tests
      run: |
        cd frontend
        npx playwright test --reporter=html
    
    - name: Upload E2E test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: e2e-test-results
        path: |
          frontend/playwright-report/
          frontend/test-results/

  performance-tests:
    runs-on: ubuntu-latest
    needs: [backend-unit-tests]
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-performance]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-html psutil
    
    - name: Run performance load tests
      run: |
        cd backend
        pytest tests/test_load_performance.py -v \
          --html=performance_report.html \
          --self-contained-html \
          -s  # Show print statements for metrics
    
    - name: Upload performance test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-test-results
        path: backend/performance_report.html

  security-tests:
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-tests]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety
    
    - name: Run security tests
      run: |
        cd backend
        pytest tests/security/ -v --html=security_report.html --self-contained-html
    
    - name: Run Bandit security linter
      run: |
        cd backend
        bandit -r app/ -f json -o bandit-report.json || true
    
    - name: Check dependencies for vulnerabilities
      run: |
        cd backend
        safety check --json --output safety-report.json || true
    
    - name: Setup Node.js for frontend security
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Audit frontend dependencies
      run: |
        cd frontend
        npm audit --json > npm-audit-report.json || true
    
    - name: Upload security test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-test-results
        path: |
          backend/security_report.html
          backend/bandit-report.json
          backend/safety-report.json
          frontend/npm-audit-report.json

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-tests, e2e-tests]
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all test artifacts
      uses: actions/download-artifact@v3
    
    - name: Create test summary report
      run: |
        echo "# 🧪 Comprehensive Test Suite Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Status Overview" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Unit Tests | ${{ needs.backend-unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Tests | ${{ needs.frontend-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📊 Test Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Backend test results and coverage reports available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Frontend test coverage available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- E2E test results with screenshots available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ needs.backend-unit-tests.result }}" != "success" ]]; then
          echo "- ❗ Fix failing backend unit tests" >> $GITHUB_STEP_SUMMARY
        fi
        if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
          echo "- ❗ Fix failing frontend tests" >> $GITHUB_STEP_SUMMARY
        fi
        if [[ "${{ needs.e2e-tests.result }}" != "success" ]]; then
          echo "- ❗ Fix failing E2E tests" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "_Automated testing completed at $(date)_" >> $GITHUB_STEP_SUMMARY