name: Claude Code Review

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code Review
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git diff

    - name: Install Claude CLI
      run: |
        # Install Claude CLI - try multiple installation methods
        if curl -fsSL https://claude.ai/install.sh | sh; then
          echo "$HOME/.claude/bin" >> $GITHUB_PATH
        elif curl -fsSL https://github.com/anthropics/claude-cli/releases/latest/download/install.sh | sh; then
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        else
          echo "Warning: Claude CLI installation failed. Using mock review mode."
          echo '#!/bin/bash' > /tmp/claude
          echo 'echo "Claude CLI not available in CI - skipping review"' >> /tmp/claude
          chmod +x /tmp/claude
          echo "/tmp" >> $GITHUB_PATH
        fi

    - name: Setup Node.js (for frontend review)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Setup Python (for backend review)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv (Python package manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync

    - name: Run Claude Code Review - General
      id: claude-general
      run: |
        if command -v claude > /dev/null 2>&1; then
          echo "🤖 Running Claude Code Review..."
          ./review-claude.sh full > claude-review-general.txt 2>&1 || echo "Claude review failed but continuing..."
        else
          echo "⚠️ Claude CLI not available. Providing manual review guidance instead." > claude-review-general.txt
          echo "" >> claude-review-general.txt
          echo "## Manual Review Checklist" >> claude-review-general.txt
          echo "Since automated Claude Code Review is not available, please manually verify:" >> claude-review-general.txt
          echo "- Code follows project conventions and best practices" >> claude-review-general.txt
          echo "- No security vulnerabilities (SQL injection, XSS, etc.)" >> claude-review-general.txt
          echo "- Proper error handling and logging" >> claude-review-general.txt
          echo "- ADK implementation follows streaming patterns correctly" >> claude-review-general.txt
          echo "- All tests pass and coverage is maintained" >> claude-review-general.txt
        fi
        echo "GENERAL_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-general.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - Security
      id: claude-security  
      run: |
        if command -v claude > /dev/null 2>&1; then
          ./review-claude.sh security > claude-review-security.txt 2>&1 || echo "Claude security review failed"
        else
          echo "⚠️ Claude CLI not available. Manual security review required." > claude-review-security.txt
          echo "Please manually verify:" >> claude-review-security.txt
          echo "- No hardcoded secrets or API keys" >> claude-review-security.txt
          echo "- Input validation on all endpoints" >> claude-review-security.txt
          echo "- Proper authentication and authorization" >> claude-review-security.txt
          echo "- SQL injection prevention" >> claude-review-security.txt
          echo "- XSS protection in frontend" >> claude-review-security.txt
        fi
        echo "SECURITY_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-security.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - ADK Specific
      id: claude-adk
      run: |
        if command -v claude > /dev/null 2>&1; then
          ./review-claude.sh adk > claude-review-adk.txt 2>&1 || echo "Claude ADK review failed"
        else
          echo "⚠️ Claude CLI not available. Manual ADK review required." > claude-review-adk.txt
          echo "Please manually verify:" >> claude-review-adk.txt
          echo "- ADK Agent initialization follows streaming patterns" >> claude-review-adk.txt
          echo "- Proper use of InMemoryRunner and LiveRequestQueue" >> claude-review-adk.txt
          echo "- Session management handles errors gracefully" >> claude-review-adk.txt
          echo "- Streaming response logic avoids duplication" >> claude-review-adk.txt
          echo "- Environment variables are properly configured" >> claude-review-adk.txt
        fi
        echo "ADK_REVIEW<<EOF" >> $GITHUB_OUTPUT
        cat claude-review-adk.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Comment PR with Claude Review
      uses: actions/github-script@v7
      with:
        script: |
          const generalReview = `${{ steps.claude-general.outputs.GENERAL_REVIEW }}`;
          const securityReview = `${{ steps.claude-security.outputs.SECURITY_REVIEW }}`;
          const adkReview = `${{ steps.claude-adk.outputs.ADK_REVIEW }}`;
          
          let comment = `## 🤖 Claude Code Review
          
          This automated review was generated by Claude Code to help identify potential issues in your pull request.
          
          ### 📋 General Code Review
          \`\`\`
          ${generalReview}
          \`\`\`
          
          ### 🔒 Security Review  
          \`\`\`
          ${securityReview}
          \`\`\`
          
          ### 🚀 ADK-Specific Review
          \`\`\`
          ${adkReview}
          \`\`\`
          
          ---
          *This review is automated and may contain false positives. Please use your judgment and review the suggestions carefully.*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload review artifacts
      uses: actions/upload-artifact@v4
      with:
        name: claude-code-review-results
        path: |
          claude-review-*.txt
        retention-days: 30