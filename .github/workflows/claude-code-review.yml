name: Claude Code Review

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude Code Review
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git diff

    - name: Setup Node.js and Install Claude CLI
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Claude Code CLI
      run: |
        npm install -g @anthropic-ai/claude-code
        claude --version || echo "Claude CLI installation verification failed"

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Setup Python (for backend review)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv (Python package manager)
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync

    - name: Run Claude Code Review - General
      id: claude-general
      run: |
        if command -v claude > /dev/null 2>&1; then
          echo "🤖 Running Claude Code Review..."
          cd backend && ./review-claude.sh general > ../claude-review-general.txt 2>&1 || echo "Claude review failed but continuing..."
        else
          echo "⚠️ Claude CLI not available. Providing manual review guidance instead." > claude-review-general.txt
          echo "" >> claude-review-general.txt
          echo "## Manual Review Checklist" >> claude-review-general.txt
          echo "Since automated Claude Code Review is not available, please manually verify:" >> claude-review-general.txt
          echo "- Code follows project conventions and best practices" >> claude-review-general.txt
          echo "- No security vulnerabilities (SQL injection, XSS, etc.)" >> claude-review-general.txt
          echo "- Proper error handling and logging" >> claude-review-general.txt
          echo "- ADK implementation follows streaming patterns correctly" >> claude-review-general.txt
          echo "- All tests pass and coverage is maintained" >> claude-review-general.txt
        fi
        # Write review to file instead of environment variable to avoid syntax issues
        if [ -f claude-review-general.txt ]; then
          echo "review_exists=true" >> $GITHUB_OUTPUT
        else
          echo "review_exists=false" >> $GITHUB_OUTPUT
        fi
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - Security
      id: claude-security  
      run: |
        if command -v claude > /dev/null 2>&1; then
          cd backend && ./review-claude.sh security > ../claude-review-security.txt 2>&1 || echo "Claude security review failed"
        else
          echo "⚠️ Claude CLI not available. Manual security review required." > claude-review-security.txt
          echo "Please manually verify:" >> claude-review-security.txt
          echo "- No hardcoded secrets or API keys" >> claude-review-security.txt
          echo "- Input validation on all endpoints" >> claude-review-security.txt
          echo "- Proper authentication and authorization" >> claude-review-security.txt
          echo "- SQL injection prevention" >> claude-review-security.txt
          echo "- XSS protection in frontend" >> claude-review-security.txt
        fi
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Run Claude Code Review - ADK Specific
      id: claude-adk
      run: |
        if command -v claude > /dev/null 2>&1; then
          cd backend && ./review-claude.sh adk > ../claude-review-adk.txt 2>&1 || echo "Claude ADK review failed"
        else
          echo "⚠️ Claude CLI not available. Manual ADK review required." > claude-review-adk.txt
          echo "Please manually verify:" >> claude-review-adk.txt
          echo "- ADK Agent initialization follows streaming patterns" >> claude-review-adk.txt
          echo "- Proper use of InMemoryRunner and LiveRequestQueue" >> claude-review-adk.txt
          echo "- Session management handles errors gracefully" >> claude-review-adk.txt
          echo "- Streaming response logic avoids duplication" >> claude-review-adk.txt
          echo "- Environment variables are properly configured" >> claude-review-adk.txt
        fi
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    - name: Comment PR with Claude Review
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          // Read review files
          let generalReview = 'No general review available';
          let securityReview = 'No security review available'; 
          let adkReview = 'No ADK review available';
          
          try {
            if (fs.existsSync('claude-review-general.txt')) {
              generalReview = fs.readFileSync('claude-review-general.txt', 'utf8');
            }
          } catch (e) {
            console.log('Could not read general review file:', e.message);
          }
          
          try {
            if (fs.existsSync('claude-review-security.txt')) {
              securityReview = fs.readFileSync('claude-review-security.txt', 'utf8');
            }
          } catch (e) {
            console.log('Could not read security review file:', e.message);
          }
          
          try {
            if (fs.existsSync('claude-review-adk.txt')) {
              adkReview = fs.readFileSync('claude-review-adk.txt', 'utf8');
            }
          } catch (e) {
            console.log('Could not read ADK review file:', e.message);
          }
          
          const comment = `## 🤖 Claude Code Review
          
This automated review was generated by Claude Code to help identify potential issues in your pull request.

### 📋 General Code Review
\`\`\`
${generalReview.trim()}
\`\`\`

### 🔒 Security Review  
\`\`\`
${securityReview.trim()}
\`\`\`

### 🚀 ADK-Specific Review
\`\`\`
${adkReview.trim()}
\`\`\`

---
*This review is automated and may contain false positives. Please use your judgment and review the suggestions carefully.*
          `;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    - name: Upload review artifacts
      uses: actions/upload-artifact@v4
      with:
        name: claude-code-review-results
        path: |
          claude-review-*.txt
        retention-days: 30